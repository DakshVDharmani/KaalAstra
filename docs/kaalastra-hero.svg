<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc">
  <title id="title">KaalAstra — commit-aware application security</title>
  <desc id="desc">A Git commit flows through local security checks and a call graph into a reviewed fix, on a dark indigo background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10152b"/>
      <stop offset="0.58" stop-color="#121d32"/>
      <stop offset="1" stop-color="#0b2430"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#59e4c0" stop-opacity=".1"/>
      <stop offset=".55" stop-color="#59e4c0" stop-opacity=".8"/>
      <stop offset="1" stop-color="#a9f274" stop-opacity=".5"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#3fd7b3" stop-opacity=".22"/>
      <stop offset="1" stop-color="#3fd7b3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#9fb5d1" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1440" height="480" rx="28" fill="url(#bg)"/>
  <rect width="1440" height="480" rx="28" fill="url(#grid)"/>
  <circle cx="1180" cy="155" r="260" fill="url(#glow)"/>
  <circle cx="1180" cy="155" r="120" fill="#43d8b1" opacity=".08" filter="url(#soft)"/>

  <g font-family="Inter, ui-sans-serif, system-ui, Segoe UI, sans-serif">
    <rect x="76" y="62" width="158" height="34" rx="17" fill="#1b2b3d" stroke="#4ae0b9" stroke-opacity=".45"/>
    <circle cx="96" cy="79" r="5" fill="#7cefbe"/>
    <text x="111" y="84" fill="#bdeee0" font-size="13" font-weight="650" letter-spacing="1.4">COMMIT-AWARE SECURITY</text>

    <text x="76" y="180" fill="#f3f7ff" font-size="66" font-weight="760" letter-spacing="-2.2">KAALASTRA</text>
    <text x="80" y="229" fill="#b8c7d9" font-size="23" font-weight="450">See the change. Trace the path. Review the fix.</text>

    <g transform="translate(80 282)">
      <rect width="192" height="92" rx="15" fill="#151f35" stroke="#7285a0" stroke-opacity=".38"/>
      <text x="18" y="29" fill="#91a5be" font-size="11" font-weight="700" letter-spacing="1.4">1 · CHANGE</text>
      <text x="18" y="56" fill="#e8eff8" font-size="17" font-weight="620">Selected commit</text>
      <text x="18" y="76" fill="#7f92aa" font-size="12">Diff + changed files</text>
    </g>
    <g transform="translate(306 282)">
      <rect width="192" height="92" rx="15" fill="#151f35" stroke="#4de0bd" stroke-opacity=".56"/>
      <text x="18" y="29" fill="#7ce9c8" font-size="11" font-weight="700" letter-spacing="1.4">2 · CONTEXT</text>
      <text x="18" y="56" fill="#e8eff8" font-size="17" font-weight="620">Call graph</text>
      <text x="18" y="76" fill="#93a9b9" font-size="12">Changed code + callers</text>
    </g>
    <g transform="translate(532 282)">
      <rect width="192" height="92" rx="15" fill="#151f35" stroke="#a9f274" stroke-opacity=".52"/>
      <text x="18" y="29" fill="#c7f69e" font-size="11" font-weight="700" letter-spacing="1.4">3 · CONTROL</text>
      <text x="18" y="56" fill="#e8eff8" font-size="17" font-weight="620">Human-reviewed fix</text>
      <text x="18" y="76" fill="#93a9b9" font-size="12">Diff first · apply by choice</text>
    </g>
    <path d="M272 328H300M498 328H526" stroke="url(#beam)" stroke-width="2"/>
    <circle cx="286" cy="328" r="3" fill="#79edc5"/>
    <circle cx="512" cy="328" r="3" fill="#b5f67e"/>
  </g>

  <g transform="translate(820 66)">
    <rect width="544" height="345" rx="20" fill="#0c1425" stroke="#71849b" stroke-opacity=".35"/>
    <rect x="1" y="1" width="542" height="43" rx="19" fill="#1a2639"/>
    <circle cx="24" cy="22" r="5" fill="#ff7383"/>
    <circle cx="43" cy="22" r="5" fill="#f2c36b"/>
    <circle cx="62" cy="22" r="5" fill="#63dfb7"/>
    <text x="91" y="27" fill="#a8b8ca" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">security-flow · selected commit</text>

    <g font-family="Inter, ui-sans-serif, system-ui, Segoe UI, sans-serif">
      <rect x="35" y="88" width="190" height="58" rx="12" fill="#142d32" stroke="#52dcb6" stroke-opacity=".8"/>
      <text x="52" y="111" fill="#78e5c5" font-size="10" font-weight="700" letter-spacing="1.1">AUTHENTICATED</text>
      <text x="52" y="132" fill="#eaf5f2" font-size="14" font-weight="600">API refund route</text>

      <rect x="35" y="204" width="190" height="58" rx="12" fill="#3a202d" stroke="#ff7187" stroke-opacity=".9"/>
      <text x="52" y="227" fill="#ff91a0" font-size="10" font-weight="700" letter-spacing="1.1">PUBLIC ENTRY POINT</text>
      <text x="52" y="248" fill="#fff0f1" font-size="14" font-weight="600">Stripe callback</text>

      <rect x="333" y="146" width="175" height="65" rx="12" fill="#302a20" stroke="#f2c36b" stroke-opacity=".85"/>
      <text x="350" y="171" fill="#f5d38f" font-size="10" font-weight="700" letter-spacing="1.1">CHANGED SINK</text>
      <text x="350" y="194" fill="#fff7e8" font-size="14" font-weight="600">refundTransaction()</text>

      <path d="M225 117C280 117 278 166 327 174" fill="none" stroke="#51dabb" stroke-width="2"/>
      <path d="M225 233C281 233 278 192 327 184" fill="none" stroke="#ff7383" stroke-width="2.5"/>
      <path d="M318 173l10 1-6 8" fill="none" stroke="#ff7383" stroke-width="2"/>
      <circle cx="275" cy="223" r="3" fill="#ff7383"/>
      <text x="245" y="296" fill="#ff9ba6" font-size="11" font-weight="620">caller context changes the risk</text>
    </g>
  </g>
</svg>
